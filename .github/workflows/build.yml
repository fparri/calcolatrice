# Compila l'APK di release a ogni push e lo rende scaricabile da GitHub.
#
# - L'APK è nella pagina dell'esecuzione (tab "Actions"), sezione "Artifacts".
# - Firma: con i Secrets SIGNING_* usa la tua chiave; altrimenti una chiave di debug
#   conservata nella cache di GitHub, così le nuove versioni si installano sopra le vecchie.
# - Un tag "v*" (es. v1.0.0) crea anche una Release con l'APK allegato.
name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Imposta JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Imposta Gradle (con cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Recupera la chiave di debug dalla cache
        if: env.HAS_SIGNING != 'true'
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Ripristina il keystore dai Secrets
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test unitari
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Compila APK di release
        env:
          SIGNING_KEYSTORE_PATH: ${{ env.HAS_SIGNING == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          [ -n "$SIGNING_KEYSTORE_PATH" ] || unset SIGNING_KEYSTORE_PATH
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "calcolatrice-${VERSION_NAME}.apk"
          ls -lh "calcolatrice-${VERSION_NAME}.apk"

      - name: Carica l'APK
        uses: actions/upload-artifact@v7
        with:
          name: calcolatrice-${{ env.VERSION_NAME }}
          path: calcolatrice-${{ env.VERSION_NAME }}.apk

      - name: Pubblica la Release su GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "calcolatrice-${VERSION_NAME}.apk" \
            --title "Calcolatrice $GITHUB_REF_NAME" --generate-notes

      - name: Elimina il keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
