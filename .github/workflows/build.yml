# Compila l'app ad ogni push e la rende scaricabile da GitHub.
#
# - Sempre: test + APK di debug (tab "Actions" → esecuzione → sezione "Artifacts").
# - Se i Secrets di firma sono configurati: anche l'APK di release firmato.
# - Se fai il push di un tag "v*" (es. v1.0.0): crea una Release con l'APK allegato.
name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Imposta JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Imposta Gradle (con cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Rendi eseguibile gradlew
        run: chmod +x gradlew

      - name: Test unitari
        run: ./gradlew testDebugUnitTest

      - name: Compila APK di debug
        run: ./gradlew assembleDebug

      - name: Carica APK di debug
        uses: actions/upload-artifact@v7
        with:
          name: calcolatrice-debug-${{ env.VERSION_NAME }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Ripristina il keystore dai Secrets
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Compila APK di release firmato
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "calcolatrice-${VERSION_NAME}.apk"

      - name: Carica APK di release
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: calcolatrice-release-${{ env.VERSION_NAME }}
          path: calcolatrice-${{ env.VERSION_NAME }}.apk

      - name: Pubblica la Release su GitHub
        if: env.HAS_SIGNING == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "calcolatrice-${VERSION_NAME}.apk" \
            --title "Calcolatrice $GITHUB_REF_NAME" --generate-notes

      - name: Elimina il keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
