# Compila e firma l'APK Release di Calcolatrice Lite.
#
# - Utilizza esclusivamente la chiave privata permanente.
# - Esegue i test unitari.
# - Verifica la firma digitale e il certificato SHA-256.
# - Genera automaticamente il numero di versione.
# - Un tag "v*" crea anche una Release con l'APK allegato.

name: Build APK

on:
  push:
    branches: ["calcolatrice-lite"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Imposta JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Imposta Gradle (con cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Ripristina il keystore dai Secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.LITE_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.LITE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          : "${SIGNING_KEYSTORE_BASE64:?Secret mancante}"
          : "${SIGNING_STORE_PASSWORD:?Password mancante}"

          printf '%s' "$SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/release.p12"

          keytool -list \
            -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 \
            -alias calcolatrice-lite \
            -storepass:env SIGNING_STORE_PASSWORD

          echo "Keystore ripristinato e verificato correttamente."

      - name: Test unitari
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Compila APK Release firmato
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.LITE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: calcolatrice-lite
          SIGNING_KEY_PASSWORD: ${{ secrets.LITE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew assembleRelease

          cp app/build/outputs/apk/release/app-release.apk \
            "calcolatrice-${VERSION_NAME}.apk"

          ls -lh "calcolatrice-${VERSION_NAME}.apk"

          echo "APK Release compilato correttamente."

      - name: Verifica firma digitale APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.LITE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          APK="calcolatrice-${VERSION_NAME}.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          test -x "$APKSIGNER"
          test -f "$APK"

          echo "Verifica della firma digitale..."

          VERIFY_OUTPUT=$("$APKSIGNER" verify \
            --verbose --print-certs "$APK")

          printf '%s\n' "$VERIFY_OUTPUT"

          EXPECTED_CERT=$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/release.p12" \
            -storetype PKCS12 \
            -alias calcolatrice-lite \
            -storepass:env SIGNING_STORE_PASSWORD \
            | sha256sum | cut -d ' ' -f 1)

          ACTUAL_CERT=$(printf '%s\n' "$VERIFY_OUTPUT" \
            | awk -F ': ' '/certificate SHA-256 digest:/ {print tolower($NF)}' \
            | sort -u)

          echo ""
          echo "Certificato atteso: $EXPECTED_CERT"
          echo "Certificato APK:    $ACTUAL_CERT"
          echo ""

          if [ -z "$ACTUAL_CERT" ]; then
            echo "ERRORE: certificato APK non trovato."
            exit 1
          fi

          if [ "$EXPECTED_CERT" != "$ACTUAL_CERT" ]; then
            echo "ERRORE: certificato non corrispondente."
            exit 1
          fi

          echo "========================================"
          echo "APK FIRMATO CORRETTAMENTE"
          echo "Firma digitale: VALIDA"
          echo "Certificato SHA-256: CORRISPONDENTE"
          echo "========================================"

      - name: Carica l'APK firmato
        uses: actions/upload-artifact@v7
        with:
          name: calcolatrice-lite-${{ env.VERSION_NAME }}-SIGNED
          path: calcolatrice-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Pubblica la Release su GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "calcolatrice-${VERSION_NAME}.apk" \
            --title "Calcolatrice Lite $GITHUB_REF_NAME" \
            --generate-notes

      - name: Elimina il keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
